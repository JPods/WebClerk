repos:
  - repo: local
    hooks:
      - id: forbid-root-docs
        name: Forbid root-level doc files (use readmes/)
        entry: >-
          bash -c '
          BLOCK_PATTERNS="^(README(|_[A-Z0-9-]+)?\.md|MAP\.md|MIGRATIONS_SQUASH\.md|UpGrade\.md|upgrade\.md|rules\.md)$"; \
          for f in $(git diff --cached --name-only --diff-filter=ACM); do \
            case "$f" in \
              readmes/*) ;; \
              *) if echo "$f" | grep -Eq "$BLOCK_PATTERNS"; then \
                   echo "ERROR: $f must reside under readmes/ (centralized documentation policy)."; \
                   exit 1; \
                 fi ;; \
            esac; \
          done'
        language: system
        pass_filenames: false
        stages: [commit]
      - id: md-trailing-whitespace-trim
        name: Trim trailing whitespace in Markdown
        entry: >-
          bash -c 'for f in $(git diff --cached --name-only --diff-filter=ACM | grep -E "\.md$"); do sed -i '' -e "s/[[:space:]]*$//" "$f"; git add "$f"; done'
        language: system
        pass_filenames: false
        stages: [commit]

# Install locally with:  pip install pre-commit && pre-commit install
