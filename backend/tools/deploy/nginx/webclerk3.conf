# nginx site config for WebClerk3 (Django API) + React frontend
# Install: sudo cp this file /etc/nginx/sites-available/webclerk3
#          sudo ln -s /etc/nginx/sites-available/webclerk3 /etc/nginx/sites-enabled/webclerk3
#          sudo nginx -t && sudo systemctl reload nginx
#
# Adjust: server_name, ssl_certificate paths, /path/to/... roots

server {
    listen 80;
    server_name 85.31.234.194 yourdomain.com;

    # Redirect all HTTP to HTTPS once a cert is installed.
    # Comment this block out if running HTTP-only during initial setup.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 85.31.234.194 yourdomain.com;

    # --- TLS (Let's Encrypt / certbot) -----------------------------------
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # --- Security headers -------------------------------------------------
    add_header X-Frame-Options           SAMEORIGIN;
    add_header X-Content-Type-Options    nosniff;
    add_header Referrer-Policy           strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- React frontend (built output) ------------------------------------
    root /path/to/React2025/dist;
    index index.html;

    # SPA fallback: any path that doesn't match a file → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Django API (gunicorn on port 8000) ------------------------------
    location /wcapi/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    60s;

        # Required for Django CSRF cookie to work cross-origin
        proxy_cookie_path / "/; SameSite=Lax";
    }

    # Django admin (optional — restrict to known IPs in production)
    location /admin/ {
        # allow 1.2.3.4;  # your IP
        # deny all;
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Django static / media -------------------------------------------
    location /static/ {
        alias /path/to/webClerk3/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /path/to/webClerk3/media/;
        expires 7d;
        access_log off;
    }

    # --- Certbot ACME challenge ------------------------------------------
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
