{% extends 'base.html' %}
{% load static %}

{% block title %}Manage {{ table_name|title }} - WebClerk 3.0{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h3 class="mb-0">
                        <i class="fas fa-database"></i> 
                        Manage {{ table_name|title }}
                    </h3>
                    <div>
                        <a href="/" class="btn btn-outline-secondary">
                            <i class="fas fa-home"></i> Home
                        </a>
                        <button onclick="createNew()" class="btn btn-primary">
                            <i class="fas fa-plus"></i> New {{ table_name|title|slice:"::-1" }}
                        </button>
                    </div>
                </div>
                
                <div class="card-body">
                    <div id="management-interface">
                        <div class="text-center">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading {{ table_name }}...</span>
                            </div>
                            <p class="mt-2">Loading {{ table_name }} management interface...</p>
                        </div>
                    </div>
                </div>
            </div> 
        </div>
    </div>
</div>

<script>
const tableName = '{{ table_name }}';

async function loadManagementInterface() {
    try {
        const response = await fetch(`/wcapi/get/?table_name=${tableName}`);
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        const data = await response.json();
        console.log('API response:', data);

        let html = '';
        if (data.success && data.data.length > 0) {
            html += '<table class="table"><thead><tr><th>ID</th><th>Sample</th><th>Actions</th></tr></thead><tbody>';
            data.data.forEach(record => {
                html += `<tr>
                    <td>${record.id}</td>
                    <td>${record.sample}</td>
                    <td>
                        <button onclick="editRecord(${record.id})" class="btn btn-sm btn-outline-primary">Edit</button>
                        <button onclick="deleteRecord(${record.id})" class="btn btn-sm btn-outline-danger">Delete</button>
                    </td>
                </tr>`;
            });
            html += '</tbody></table>';
        } else {
            html = '<div class="alert alert-warning">No records found.</div>';
        }
        document.getElementById('management-interface').innerHTML = html;
    } catch (error) {
        document.getElementById('management-interface').innerHTML =
            `<div class="alert alert-danger">Error loading data: ${error.message}</div>`;
        console.error('Error loading management interface:', error);
    }
}

// Load data automatically when the page is ready
document.addEventListener('DOMContentLoaded', loadManagementInterface);
</script>
{% endblock %}
