name: CI

on:
  push:
    branches: [ main, bill_dev ]
  pull_request:
    branches: [ main, bill_dev ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: 1
  PYTEST_FORCE_DB: 0
  USE_SQLITE_TEST: 1  # default to in-memory SQLite for speed
  DJANGO_SETTINGS_MODULE: webclerk3_api.settings
  # Provide a fallback SECRET_KEY so settings import succeeds
  SECRET_KEY: ci-fallback-secret-key
  COVERAGE_FAIL_UNDER: 70

jobs:
  smoke:
    name: Smoke (markers=smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.13'
            cache: 'pip'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django hypothesis coverage
      - name: Run smoke tests
        run: |
          pytest -q -m smoke --junitxml=pytest-smoke.xml
      - name: Upload smoke JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-smoke
          path: pytest-smoke.xml

  tests:
    name: Full Test Matrix
    needs: smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12', '3.13' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django hypothesis coverage
      - name: Run fast subset first (fail early)
        run: |
          pytest -q -m fast --junitxml=pytest-fast-${{ matrix.python-version }}.xml
      - name: Run full test suite
        run: |
          coverage run -m pytest -q --junitxml=pytest-full-${{ matrix.python-version }}.xml || true
      - name: Combine coverage (matrix instance)
        run: |
          coverage xml -o coverage-${{ matrix.python-version }}.xml || true
          mv .coverage .coverage.${{ matrix.python-version }} || true
          coverage report -m || true
      - name: Upload JUnit & coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: |
            pytest-fast-${{ matrix.python-version }}.xml
            pytest-full-${{ matrix.python-version }}.xml
            coverage-${{ matrix.python-version }}.xml
            .coverage.${{ matrix.python-version }}

  integration:
    name: Postgres Integration & Postman
    needs: tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commerce_expert
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django hypothesis newman coverage
      - name: Run integration-marked tests (Postgres)
        env:
          PYTEST_FORCE_DB: 1
          USE_SQLITE_TEST: 0
          DATABASE_NAME: commerce_expert
          DATABASE_USER: postgres
          DATABASE_PASS: postgres
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 5432
        run: |
          coverage run -m pytest -q -m "integration and not slow" --junitxml=pytest-integration.xml || true
      - name: Launch Django (background) for Postman
        env:
          PYTEST_FORCE_DB: 1
          USE_SQLITE_TEST: 0
          DATABASE_NAME: commerce_expert
          DATABASE_USER: postgres
          DATABASE_PASS: postgres
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 5432
        run: |
          python manage.py migrate --noinput
          nohup python manage.py runserver 0.0.0.0:8000 &
          sleep 5
      - name: Run Postman collection (Universal API minimal)
        run: |
          newman run api_tests/UniversalAPI.postman_collection.json -e api_tests/local.postman_environment.json --reporters cli,junit --reporter-junit-export postman-results.xml || true
      - name: Prepare coverage artifacts
        run: |
          coverage xml -o coverage-integration.xml || true
          mv .coverage .coverage.integration || true
      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: |
            pytest-integration.xml
            postman-results.xml
            coverage-integration.xml
            .coverage.integration

  coverage-aggregate:
    name: Coverage Aggregate & Threshold
    needs: [tests, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (empty workspace for reports)
        uses: actions/checkout@v4
      - name: Download matrix coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Combine coverage
        run: |
          python -m pip install --upgrade pip
          pip install coverage
          ls -R artifacts || true
          find artifacts -name '.coverage.*' -exec cp {} . \;
          coverage combine || true
          coverage report -m --fail-under=${COVERAGE_FAIL_UNDER}
          coverage xml -o coverage-combined.xml || true
      - name: Upload combined coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-combined
          path: |
            coverage-combined.xml
      - name: Upload to Codecov
        if: success() || failure()
        uses: codecov/codecov-action@v4
        with:
          files: coverage-combined.xml
          token: ${{ secrets.CODECOV_TOKEN }} # not required if public & GitHub app installed
          flags: combined
          fail_ci_if_error: false

