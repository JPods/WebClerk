<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
            Django App
        {% endblock %}
    </title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
    {% block styles %}
    {% endblock %}
    <script src="{% static 'js/main.js' %}" defer></script>
</head>
<body>
    <nav>
        <a href="/">
            <!-- Home icon formating to correct of errors -->
            <span role="img" aria-label="Home" title="Home">🏠</span></a> | 
        <a href="/about">About</a> |
        {% if user.is_authenticated %}
            <a href="/admin">Admin</a> |
            <a href="/contact/" class="contact-link">Hi, {{ user.name_first }} {{ user.name_last }}!</a> |
            <form class="logout" method="post" action="{% url 'web-logout' %}" style="display: inline;">
                {% csrf_token %}
                <button type="submit" class="logout-button" aria-label="Logout" title="Logout">🤚</button>
            </form>
        {% else %}
            <a href="/signup/">Sign Up</a> |
            <a href="/login/">Login</a>
        {% endif %}
    </nav>
    <main>
        {% block content %}
        {% endblock %}
</body>
</html>
