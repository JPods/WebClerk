[pytest]
DJANGO_SETTINGS_MODULE = webclerk3_api.settings
python_files = tests.py test_*.py *_tests.py
addopts = -q
python_files = test_*.py *_tests.py
addopts = -p no:warnings --ignore=lib/python3.13/site-packages --strict-markers

filterwarnings =
    ignore:.*pkg_resources.* is deprecated.*:UserWarning

markers =
    hooks: tests validating model hook contracts & behavior
    slow: long-running or high I/O tests (excluded by -m "not slow")
    integration: crosses service or DB boundaries
    unit: fast, pure logic tests
    focus: temporary marker for local runs (use -m focus)
    flaky: intermittently failing tests
    bill_of_material: bill of material model integrity & cost roll-up tests
    fast: very quick smoke / unit tests for rapid feedback (subset of suite)
    smoke: ultra-fast single-digit tests (<1s) for immediate sanity check


; Removed bare tests.py discovery to avoid import collisions where both
; apps/<app>/tests.py (placeholder) and apps/<app>/tests/ package exist.
