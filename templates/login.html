{% extends 'layout.html' %}

{% block title %}Login - WebClerk 3.0{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Welcome Back</h2>
    <p>Sign in to your WebClerk 3.0 account.</p>
    
    <form method="post" class="auth-form">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        
        <button type="submit" class="auth-btn">Login</button>
    </form>
    
    <p class="auth-link">
        Don't have an account? <a href="/WCapi/web-signup/">Sign up here</a>
    </p>
</div>

<style>
.auth-container {
    max-width: 400px;
    margin: 50px auto;
    padding: 30px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background-color: #f9f9f9;
}

.auth-form {
    margin-top: 20px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    color: #333;
}

.form-group input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
}

.auth-btn {
    width: 100%;
    padding: 12px;
    background-color: #007cba;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
}

.auth-btn:hover {
    background-color: #005a8b;
}

.auth-link {
    text-align: center;
    margin-top: 20px;
}

.auth-link a {
    color: #007cba;
    text-decoration: none;
}

.auth-link a:hover {
    text-decoration: underline;
}
</style>
{% endblock %}
