{% extends 'base.html' %}
{% load static %}

{% block title %}Manage Actions - WebClerk 3.0{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h3 class="mb-0">
                        <i class="fas fa-tasks"></i> 
                        Manage Actions
                        {% if contact_id %}for Contact {{ contact_id }}{% endif %}
                    </h3>
                    <div>
                        <a href="/" class="btn btn-outline-secondary">
                            <i class="fas fa-home"></i> Home
                        </a>
                        <button onclick="createNewAction()" class="btn btn-primary">
                            <i class="fas fa-plus"></i> New Action
                        </button>
                    </div>
                </div>
                
                <div class="card-body">
                    <div id="actions-management">
                        <div class="text-center">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading actions...</span>
                            </div>
                            <p class="mt-2">Loading actions management interface...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const contactId = new URLSearchParams(window.location.search).get('contact_id');

async function loadActionsManagement() {
    try {
        let url = '/wcapi/get/?table_name=actions';
        if (contactId) {
            url += `&refs.links.contacts=${contactId}`;
        }
        
        const response = await fetch(url);
        const data = await response.json();
        
        let html = `
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Action</th>
                            <th>Status</th>
                            <th>Priority</th>
                            <th>Due Date</th>
                            <th>Progress</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
        `;
        
        if (data.success && data.data.length > 0) {
            data.data.forEach(action => {
                const dueDate = action.dt_due ? new Date(action.dt_due).toLocaleDateString() : '-';
                const progress = action.percent || 0;
                
                html += `
                    <tr>
                        <td>${action.action || 'Untitled Action'}</td>
                        <td>
                            <select class="form-select form-select-sm" onchange="updateStatus(${action.id}, this.value)">
                                <option value="pending" ${action.status === 'pending' ? 'selected' : ''}>Pending</option>
                                <option value="in_progress" ${action.status === 'in_progress' ? 'selected' : ''}>In Progress</option>
                                <option value="completed" ${action.status === 'completed' ? 'selected' : ''}>Completed</option>
                                <option value="cancelled" ${action.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                                <option value="on_hold" ${action.status === 'on_hold' ? 'selected' : ''}>On Hold</option>
                            </select>
                        </td>
                        <td>
                            <select class="form-select form-select-sm" onchange="updatePriority(${action.id}, this.value)">
                                <option value="low" ${action.priority === 'low' ? 'selected' : ''}>Low</option>
                                <option value="medium" ${action.priority === 'medium' ? 'selected' : ''}>Medium</option>
                                <option value="high" ${action.priority === 'high' ? 'selected' : ''}>High</option>
                                <option value="urgent" ${action.priority === 'urgent' ? 'selected' : ''}>Urgent</option>
                            </select>
                        </td>
                        <td>${dueDate}</td>
                        <td>
                            <div class="input-group input-group-sm">
                                <input type="number" class="form-control" value="${progress}" min="0" max="100" 
                                       onchange="updateProgress(${action.id}, this.value)">
                                <span class="input-group-text">%</span>
                            </div>
                        </td>
                        <td>
                            <button onclick="editAction(${action.id})" class="btn btn-sm btn-outline-primary">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="deleteAction(${action.id})" class="btn btn-sm btn-outline-danger">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
        } else {
            html += `
                <tr>
                    <td colspan="6" class="text-center text-muted">
                        No actions found. <button onclick="createNewAction()" class="btn btn-sm btn-primary">Create your first action</button>
                    </td>
                </tr>
            `;
        }
        
        html += `
                    </tbody>
                </table>
            </div>
        `;
        
        document.getElementById('actions-management').innerHTML = html;
    } catch (error) {
        console.error('Error loading actions:', error);
        document.getElementById('actions-management').innerHTML = `
            <p class="text-danger">Error loading actions. <a href="javascript:loadActionsManagement()">Try again</a></p>
        `;
    }
}

function createNewAction() {
    const actionName = prompt('Enter action name:');
    if (actionName) {
        alert(`Creating action: ${actionName}\nThis would use: POST /wcapi/save/?table_name=actions`);
        loadActionsManagement(); // Reload
    }
}

function updateStatus(actionId, newStatus) {
    alert(`Updating action ${actionId} status to: ${newStatus}\nThis would use: PUT /wcapi/save/?table_name=actions&id=${actionId}`);
}

function updatePriority(actionId, newPriority) {
    alert(`Updating action ${actionId} priority to: ${newPriority}\nThis would use: PUT /wcapi/save/?table_name=actions&id=${actionId}`);
}

function updateProgress(actionId, newProgress) {
    alert(`Updating action ${actionId} progress to: ${newProgress}%\nThis would use: PUT /wcapi/save/?table_name=actions&id=${actionId}`);
}

function editAction(actionId) {
    alert(`Editing action ${actionId}\nThis would open a detailed edit form.`);
}

function deleteAction(actionId) {
    if (confirm('Are you sure you want to delete this action?')) {
        alert(`Deleting action ${actionId}\nThis would use: DELETE /wcapi/delete/?table_name=actions&id=${actionId}`);
        loadActionsManagement(); // Reload
    }
}

document.addEventListener('DOMContentLoaded', function() {
    loadActionsManagement();
});
</script>
{% endblock %}
