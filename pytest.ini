[pytest]
DJANGO_SETTINGS_MODULE = webclerk3_api.settings
python_files = test_*.py *_tests.py
addopts = -p no:warnings --ignore=lib/python3.13/site-packages
filterwarnings =
	ignore:.*pkg_resources is deprecated.*:UserWarning

; Removed bare tests.py discovery to avoid import collisions where both
; apps/<app>/tests.py (placeholder) and apps/<app>/tests/ package exist.
