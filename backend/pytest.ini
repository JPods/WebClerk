[pytest]
DJANGO_SETTINGS_MODULE = webclerk3_api.settings
python_files = tests.py test_*.py *_tests.py
addopts =
    --cov=apps
    --cov=common
    --cov-report=term-missing
    --cov-fail-under=40
    --tb=short
    -q
    --strict-markers
markers =
    smoke: structural health checks
    envelope: API envelope contract tests
    schema: Pydantic/model schema validation
    wcapi: CRUD through wcapi endpoints
    domain: business logic tests
    integration: full commerce cycle (requires PostgreSQL)
    slow: marks tests as slow
    hooks: model hook contract tests
    fast: quick-running tests
    unit: unit tests
    bill_of_material: BOM-related tests
