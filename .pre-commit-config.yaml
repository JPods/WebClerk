repos:
  - repo: local
    hooks:
      - id: forbid-root-docs
        name: Forbid root-level doc files (use readmes/)
        entry: bash
        args:
          - -c
          - |
            set -euo pipefail
            BLOCK_PATTERNS="^(README(|_[A-Z0-9-]+)?\.md|MAP\.md|MIGRATIONS_SQUASH\.md|UpGrade\.md|upgrade\.md|rules\.md)$"
            for f in $(git diff --cached --name-only --diff-filter=ACM); do
              case "$f" in
                readmes/*) ;;
                *) if echo "$f" | grep -Eq "$BLOCK_PATTERNS"; then
                     echo "ERROR: $f must reside under readmes/ (centralized documentation policy)."
                     exit 1
                   fi ;;
              esac
            done
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: md-trailing-whitespace-trim
        name: Trim trailing whitespace in Markdown
        entry: bash
        args:
          - -c
          - |
            set -euo pipefail
            for f in $(git diff --cached --name-only --diff-filter=ACM | grep -E "\.md$"); do
              sed -i '' -e "s/[[:space:]]*$//" "$f"
              git add "$f"
            done
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: single-initial-migration
        name: Enforce single 0001_initial per app (no additional numbered migrations)
        entry: >-
          bash -c '
          APPS_DIR="apps"; violations=0; 
          ALLOW=${ALLOW_MULTIPLE_MIGRATIONS:-0}; PROTECTED_BRANCHES="${PROTECTED_BRANCHES:-main bill_dev}";
          BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "");
          MODE=fail; for p in $PROTECTED_BRANCHES; do [ "$BRANCH" = "$p" ] && MODE=fail && break || MODE=warn; done;
          [ "$ALLOW" = "1" ] && echo "ALLOW_MULTIPLE_MIGRATIONS=1 set; skipping enforcement." && exit 0;
          for app in $(find "$APPS_DIR" -maxdepth 1 -mindepth 1 -type d); do 
            count=$(find "$app/migrations" -maxdepth 1 -type f -name "[0-9][0-9][0-9][0-9]*.py" 2>/dev/null | wc -l | tr -d " ");
            if [ "$count" -gt 1 ]; then 
              if [ "$MODE" = "fail" ]; then echo "ERROR: $app has $count migration files (policy: single baseline)."; violations=$((violations+1)); 
              else echo "WARNING: $app has $count migration files (policy: single baseline)."; fi; 
            fi; 
          done; 
          if [ "$violations" -gt 0 ]; then exit 1; fi'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: forbid-nuke-commit
        name: Forbid committing nuke_migrations invocation references
        entry: >-
          bash -c '
          if git diff --cached | grep -E "full_reset_seed" | grep -q "--nuke-migrations"; then 
             echo "ERROR: Remove --nuke-migrations from committed script/README examples (local-only flag)."; exit 1; fi'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: docs-consistency
        name: Docs index & TOC consistency (docs_index.json + readmes TOC)
        # Auto-regeneration now handled by preceding docs-index-regenerate hook.
        entry: bash
        args:
          - -c
          - |
            set -euo pipefail
            if [ -x ./bin/python ]; then
              ./bin/python Scripts/check_docs_consistency.py
            elif command -v python3 >/dev/null 2>&1; then
              python3 Scripts/check_docs_consistency.py
            else
              python Scripts/check_docs_consistency.py
            fi
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: docs-index-regenerate
        name: Regenerate docs_index.json (if stale)
        entry: bash
        args:
          - -c
          - |
            set -euo pipefail
            # Regenerate into a temp file then compare to avoid unnecessary git add.
            TMP_FILE=$(mktemp)
            if [ -x ./bin/python ]; then
              ./bin/python Scripts/gen_docs_index.py >/dev/null
            elif command -v python3 >/dev/null 2>&1; then
              python3 Scripts/gen_docs_index.py >/dev/null
            else
              python Scripts/gen_docs_index.py >/dev/null
            fi
            # gen script writes directly to docs_index.json; stage if changed.
            if ! git diff --quiet -- docs_index.json; then
              echo "[docs-index-regenerate] Staging updated docs_index.json"
              git add docs_index.json
            fi
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: docs-layout-guard
        name: Documentation layout guard (validate_docs_location.sh)
        entry: >-
          bash -c 'bash .github/scripts/validate_docs_location.sh'
        language: system
        pass_filenames: false
        stages: [pre-commit]

# Install locally with:  pip install pre-commit && pre-commit install
