{% extends 'base.html' %}
{% load static %}

{% block title %}Manage {{ table_name|title }} - WebClerk 3.0{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h3 class="mb-0">
                        <i class="fas fa-database"></i> 
                        Manage {{ table_name|title }}
                    </h3>
                    <div>
                        <a href="/" class="btn btn-outline-secondary">
                            <i class="fas fa-home"></i> Home
                        </a>
                        <button onclick="createNew()" class="btn btn-primary">
                            <i class="fas fa-plus"></i> New {{ table_name|title|slice:"::-1" }}
                        </button>
                    </div>
                </div>
                
                <div class="card-body">
                    <div id="management-interface">
                        <div class="text-center">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading {{ table_name }}...</span>
                            </div>
                            <p class="mt-2">Loading {{ table_name }} management interface...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const tableName = '{{ table_name }}';
const recordId = '{{ record_id }}';

async function loadManagementInterface() {
    try {
        const response = await fetch(`/WCapi/get/?table_name=${tableName}`);
        const data = await response.json();
        
        let html = `
            <div class="alert alert-success">
                <i class="fas fa-check-circle"></i> 
                Universal API is working! Connected to <strong>${tableName}</strong> table.
            </div>
            
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Table</th>
                            <th>Sample Data</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
        `;
        
        if (data.success && data.data.length > 0) {
            data.data.forEach(record => {
                html += `
                    <tr>
                        <td>${record.id}</td>
                        <td>${record.table}</td>
                        <td>${record.sample}</td>
                        <td>
                            <button onclick="editRecord(${record.id})" class="btn btn-sm btn-outline-primary">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button onclick="deleteRecord(${record.id})" class="btn btn-sm btn-outline-danger">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </td>
                    </tr>
                `;
            });
        } else {
            html += `
                <tr>
                    <td colspan="4" class="text-center text-muted">
                        No records found. <button onclick="createNew()" class="btn btn-sm btn-primary">Create your first record</button>
                    </td>
                </tr>
            `;
        }
        
        html += `
                    </tbody>
                </table>
            </div>
            
            <div class="mt-4">
                <h5>Universal API Endpoints for ${tableName}:</h5>
                <ul class="list-unstyled">
                    <li><code>GET /WCapi/get/?table_name=${tableName}</code> - List all records</li>
                    <li><code>GET /WCapi/get/?table_name=${tableName}&id=123</code> - Get specific record</li>
                    <li><code>POST /WCapi/save/?table_name=${tableName}</code> - Create new record</li>
                    <li><code>PUT /WCapi/save/?table_name=${tableName}&id=123</code> - Update record</li>
                    <li><code>DELETE /WCapi/delete/?table_name=${tableName}&id=123</code> - Delete record</li>
                </ul>
            </div>
        `;
        
        document.getElementById('management-interface').innerHTML = html;
    } catch (error) {
        console.error('Error loading management interface:', error);
        document.getElementById('management-interface').innerHTML = `
            <div class="alert alert-danger">
                <i class="fas fa-exclamation-triangle"></i> 
                Error loading ${tableName} data. <a href="javascript:loadManagementInterface()">Try again</a>
            </div>
        `;
    }
}

function createNew() {
    alert(`Creating new ${tableName} record\nThis would use: POST /WCapi/save/?table_name=${tableName}`);
}

function editRecord(id) {
    alert(`Editing ${tableName} record ${id}\nThis would use: GET /WCapi/get/?table_name=${tableName}&id=${id}`);
}

function deleteRecord(id) {
    if (confirm(`Are you sure you want to delete this ${tableName} record?`)) {
        alert(`Deleting ${tableName} record ${id}\nThis would use: DELETE /WCapi/delete/?table_name=${tableName}&id=${id}`);
        loadManagementInterface(); // Reload
    }
}

document.addEventListener('DOMContentLoaded', function() {
    loadManagementInterface();
});
</script>
{% endblock %}
